<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos Charcutería - Super 900</title>
    <style>
        :root {
            --brand-color: #e63946;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--brand-color); }
        button {
            background-color: var(--brand-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #c1121f; }
        .btn-control-alarma {
            background-color: #2b2d42;
            color: white;
            margin-top: 20px;
            padding: 18px;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-control-alarma:hover { background-color: #1d3557; }
        .hidden { display: none; }
        .numero-turno {
            font-size: 80px;
            font-weight: 900;
            color: var(--brand-color);
            margin: 10px 0;
        }
        .alerta-llamado {
            animation: parpadeo 0.8s infinite;
            color: #d62828;
            font-weight: bold;
            font-size: 22px;
            margin-top: 15px;
        }
        @keyframes parpadeo {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--brand-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card" id="pantalla-solicitud">
        <h2>Super 900</h2>
        <p>Ingresa tu nombre para solicitar un turno en Charcutería</p>
        <input type="text" id="nombre" placeholder="Tu Nombre y Apellido" required>
        <button id="btn-solicitar" onclick="pedirTurno()">Obtener Turno</button>
        <div id="loading" class="loader hidden"></div>
        <p id="error-msg" style="color: red;" class="hidden"></p>
    </div>

    <div class="card hidden" id="pantalla-turno">
        <p style="color: #666; margin:0;">Tu número asignado es:</p>
        <div class="numero-turno" id="mi-numero">--</div>
        <p style="color: #666;">Cliente: <span id="nombre-display" style="font-weight: bold;"></span></p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="color: #666; margin:0; font-size: 14px;">Turno actual en mesón:</p>
        <div class="numero-turno" style="font-size: 50px; color: #333;" id="turno-actual">--</div>
        <div id="estado-mensaje">Mantén esta pantalla abierta. Te avisaremos al tocar tu turno.</div>
        
        <!-- Botón On/Off de Alarma -->
        <button id="btn-silenciar" class="btn-control-alarma hidden" onclick="toggleAlarma()">Silenciar Alarma 🔕</button>
    </div>

    <script>
        // Pega aquí exactamente tu enlace de Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbwtrxytzOIXbNGWlWxZlt2gY5vpEmnJEf6Rq-Pc3V2wGbHlXlahO3vXbuQ2AMuzOsDz/exec";
        
        let miTurno = null;
        let intervaloCheck = null;
        let audioContext = null;
        let alarmaIntervalo = null;
        let esMiTurno = false;
        let alarmaSilenciadaManual = false;

        function inicializarAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        async function pedirTurno() {
            inicializarAudio();
            const nombre = document.getElementById("nombre").value;
            const btn = document.getElementById("btn-solicitar");
            const loading = document.getElementById("loading");
            const errorMsg = document.getElementById("error-msg");

            if(nombre.trim() === "") {
                errorMsg.innerText = "Por favor, ingresa tu nombre.";
                errorMsg.classList.remove("hidden");
                return;
            }

            btn.classList.add("hidden");
            loading.classList.remove("hidden");
            errorMsg.classList.add("hidden");

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ nombre: nombre })
                });
                const data = await res.json();

                if(data.exito) {
                    miTurno = data.miTurno;
                    document.getElementById("pantalla-solicitud").classList.add("hidden");
                    document.getElementById("pantalla-turno").classList.remove("hidden");
                    
                    document.getElementById("mi-numero").innerText = miTurno;
                    document.getElementById("nombre-display").innerText = nombre;
                    
                    iniciarMonitoreo();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                errorMsg.innerText = "Error de conexión. Intenta de nuevo.";
                errorMsg.classList.remove("hidden");
                btn.classList.remove("hidden");
                loading.classList.add("hidden");
            }
        }

        function tocarCampanaYVibrar() {
            if (!audioContext || alarmaSilenciadaManual || !esMiTurno) return;
            
            // Intento de vibración en dispositivos móviles compatibles
            if (navigator.vibrate) {
                try {
                    navigator.vibrate([800, 200, 800, 200, 800]);
                } catch(e) {}
            }
            
            try {
                const now = audioContext.currentTime;
                
                const osc1 = audioContext.createOscillator();
                const gain1 = audioContext.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                gain1.gain.setValueAtTime(0.9, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc1.connect(gain1);
                gain1.connect(audioContext.destination);
                osc1.start(now);
                osc1.stop(now + 0.8);

                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.25);
                gain2.gain.setValueAtTime(0.9, now + 0.25);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.start(now + 0.25);
                osc2.stop(now + 1.1);

            } catch(e) {
                console.log("Audio omitido");
            }
        }

        function iniciarAlarmaBucle() {
            if (alarmaIntervalo) return; // Ya está corriendo el bucle
            
            tocarCampanaYVibrar();
            alarmaIntervalo = setInterval(() => {
                tocarCampanaYVibrar();
            }, 1500); 
        }

        // Botón Interruptor (On / Off)
        function toggleAlarma() {
            const btnSilenciar = document.getElementById("btn-silenciar");
            
            if (!alarmaSilenciadaManual) {
                // APAGAR alarma manualmente
                alarmaSilenciadaManual = true;
                if (alarmaIntervalo) {
                    clearInterval(alarmaIntervalo);
                    alarmaIntervalo = null;
                }
                if (navigator.vibrate) navigator.vibrate(0);
                btnSilenciar.innerText = "Activar Alarma 🔔";
                btnSilenciar.style.backgroundColor = "#e63946";
            } else {
                // ENCENDER alarma manualmente
                alarmaSilenciadaManual = false;
                btnSilenciar.innerText = "Silenciar Alarma 🔕";
                btnSilenciar.style.backgroundColor = "#2b2d42";
                if (esMiTurno) {
                    iniciarAlarmaBucle();
                }
            }
        }

        function iniciarMonitoreo() {
            intervaloCheck = setInterval(async () => {
                try {
                    const res = await fetch(API_URL);
                    const data = await res.json();
                    
                    if(data.exito) {
                        document.getElementById("turno-actual").innerText = data.turnoActual;
                        
                        if (data.turnoActual == miTurno) {
                            esMiTurno = true;
                            const msj = document.getElementById("estado-mensaje");
                            msj.innerText = "¡ES TU TURNO! ACÉRCATE AL MOSTRADOR";
                            msj.className = "alerta-llamado";
                            
                            // Muestra el botón de silenciar en cuanto sea su turno
                            document.getElementById("btn-silenciar").classList.remove("hidden");
                            
                            // Si el usuario no la ha silenciado a mano, suena y vibra
                            if (!alarmaSilenciadaManual) {
                                iniciarAlarmaBucle();
                            }
                        }
                    }
                } catch (e) {
                    console.log("Sincronizando...");
                }
            }, 5000); 
        }
    </script>
</body>
</html>
