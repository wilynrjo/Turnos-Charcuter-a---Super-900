<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Charcutería</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f8f9fa; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel { 
            background: white; 
            width: 100%;
            max-width: 450px; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        h2 { color: #2b2d42; margin-bottom: 5px; }
        .numero { 
            font-size: 80px; 
            color: #e63946; 
            font-weight: 900; 
            margin: 5px 0; 
        }
        .nombre-cliente {
            font-size: 22px;
            color: #1d3557;
            font-weight: bold;
            background: #f1faee;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px dashed #a8dadc;
        }
        button { 
            background: #2a9d8f; 
            color: white; 
            border: none; 
            padding: 16px; 
            width: 100%; 
            font-size: 18px; 
            font-weight: bold;
            border-radius: 10px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #21867a; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-reset {
            background-color: #e63946;
            font-size: 15px;
            padding: 12px;
            margin-top: 15px;
        }
        .btn-reset:hover { background-color: #c1121f; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Turno Actual</h2>
        <div class="numero" id="turno-actual">0</div>
        
        <div class="nombre-cliente" id="nombre-actual">Cliente: --</div>
        
        <button id="btn-siguiente" onclick="llamarSiguiente()">Llamar Siguiente 📢</button>
        <button class="btn-reset" onclick="resetearSistema()">Reiniciar Turnos a 0 🔄</button>
    </div>

    <script>
        // Pega aquí exactamente tu enlace de Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbwtrxytzOIXbNGWlWxZlt2gY5vpEmnJEf6Rq-Pc3V2wGbHlXlahO3vXbuQ2AMuzOsDz/exec";

        async function obtenerActual() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if(data.exito) {
                    document.getElementById("turno-actual").innerText = data.turnoActual;
                    document.getElementById("nombre-actual").innerText = "Cliente: " + data.nombreActual;
                }
            } catch (e) {
                console.log("Error actualizando panel");
            }
        }

        async function llamarSiguiente() {
            const btn = document.getElementById("btn-siguiente");
            btn.disabled = true;
            btn.innerText = "Avanzando...";
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ accion: "siguiente" })
                });
                const data = await res.json();
                
                if(data.exito) {
                    await obtenerActual();
                } else {
                    alert(data.error || "No hay más turnos pendientes.");
                }
            } catch (e) {
                alert("Error de conexión al avanzar turno.");
            }
            
            btn.disabled = false;
            btn.innerText = "Llamar Siguiente 📢";
        }

        async function resetearSistema() {
            if (!confirm("¿Estás seguro de reiniciar los turnos a 0 y borrar el historial actual?")) return;
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ accion: "reset" })
                });
                const data = await res.json();
                
                if(data.exito) {
                    document.getElementById("turno-actual").innerText = "0";
                    document.getElementById("nombre-actual").innerText = "Cliente: --";
                    alert("Sistema reiniciado a 0 correctamente.");
                } else {
                    alert("Error al resetear el sistema.");
                }
            } catch (e) {
                alert("Error de conexión al resetear.");
            }
        }

        obtenerActual();
        setInterval(obtenerActual, 4000);
    </script>
</body>
</html>
