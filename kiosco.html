<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco - Tomar Turno</title>
    <!-- Librería para generar el código QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e63946; /* Color corporativo */
            color: white;
            text-align: center;
        }
        .contenedor-qr {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin: 25px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        p { font-size: 1.3em; opacity: 0.9; }
        #qrcode img { margin: 0 auto; }
    </style>
</head>
<body>
    <h1>Super 900</h1>
    <p>Escanea con tu celular para tomar tu turno en Charcutería</p>
    
    <div class="contenedor-qr">
        <div id="qrcode"></div>
    </div>

    <script>
        // AQUÍ ESTÁ EL CAMBIO CLAVE: Apunta directo a cliente.html
        const urlClienteDirecta = "https://charcuteriasuper900.vercel.app/cliente.html"; 
        
        new QRCode(document.getElementById("qrcode"), {
            text: urlClienteDirecta,
            width: 280,
            height: 280,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
